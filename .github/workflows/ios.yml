# iOS on a macOS runner: the checks the Windows machine cannot run.
#
# Builds the app for iPhone without signing (no Apple team, certificate or
# provisioning profile is involved) and runs the analyzer and the tests.
# A passing run shows the iOS project, its Swift packages / pods and the
# Dart code compile for iOS. It does not show that the app runs on an
# iPhone, that push (APNs) or Universal Links work, or that it can be
# signed and uploaded: those need the Apple developer account.
name: iOS build

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version this app is developed with (flutter --version).
          flutter-version: 3.50.0
          cache: true

      - name: Flutter and Xcode versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --file-reporter json:build/test-report.json

      # Job logs need a GitHub sign-in to read; annotations do not. Each
      # failing test becomes an annotation with its name and error.
      - name: Failing tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          names, errors = {}, {}
          for line in open('build/test-report.json'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  t = e['test']
                  names[t['id']] = (t['name'], t.get('url') or t.get('root_url') or '')
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
          for test_id, errs in errors.items():
              name, url = names.get(test_id, ('(loading)', ''))
              where = url.split('/test/')[-1] if '/test/' in url else url
              message = (' | '.join(errs))[:900].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=test/{where}: {name[:120]}::{message}')
          PY

      - name: Build for iPhone, unsigned
        run: flutter build ios --release --no-codesign

      - name: Keep the unsigned app for a week
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
