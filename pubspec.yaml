name: rightproperty365
description: "RightProperty365 mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  # Keeps the session token in the Android Keystore / iOS Keychain.
  flutter_secure_storage: any
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  pdfx: ^2.11.0
  timezone: ^0.11.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.3.1
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  file_picker: ^13.4.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generate launcher icons and the splash screen from assets/brand:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    # SAMPLE data and photos mirrored from the web repository by
    # tool/sync_web_data.mjs. Do not edit by hand.
    - assets/data/
    - assets/images/
    # Official logo kit v4.1.
    - assets/brand/
    # The font licences travel with the fonts.
    - assets/fonts/signature/GreatVibes-OFL.txt
    - assets/fonts/signature/KaushanScript-OFL.txt
    - assets/fonts/signature/Allura-OFL.txt

  # Typed signature styles, the same fonts the API draws signatures in
  # (SIL Open Font License 1.1; copied from the web repository's
  # src/fonts/signature/ with their OFL texts).
  fonts:
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/signature/GreatVibes-Regular.ttf
    - family: KaushanScript
      fonts:
        - asset: assets/fonts/signature/KaushanScript-Regular.ttf
    - family: Allura
      fonts:
        - asset: assets/fonts/signature/Allura-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app-icon-1024.png
  adaptive_icon_background: "#1900AC"
  adaptive_icon_foreground: assets/brand/mark-reverse-1024.png
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#1900AC"
  image: assets/brand/mark-reverse-512.png
  android_12:
    color: "#1900AC"
    image: assets/brand/mark-reverse-512.png
